# Production-like stack (single host). Usage:
#   cp deploy/.env.prod.example deploy/.env.prod   # then fill every value
#   docker compose -p safetypad-prod -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Postgres and the backend are reachable only inside the compose network.
name: safetypad-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-safetypad}
      POSTGRES_USER: ${DB_USER:-safetypad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safetypad} -d ${DB_NAME:-safetypad}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}   # JVM sizes its heap from this cgroup limit (MaxRAMPercentage)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Duser.timezone=UTC"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-safetypad}
      DB_USER: ${DB_USER:-safetypad}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DEVICE_KEY_PEPPER: ${DEVICE_KEY_PEPPER:?set DEVICE_KEY_PEPPER}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      METRICS_USERNAME: ${METRICS_USERNAME:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      INGEST_PER_KEY_PER_MINUTE: ${INGEST_PER_KEY_PER_MINUTE:-120}
      INGEST_PER_IP_PER_MINUTE: ${INGEST_PER_IP_PER_MINUTE:-600}
      # MQTT ingestion is OFF unless MQTT_ENABLED=true. Production accepts MQTT over TLS only (see docs/MQTT_INTEGRATION.md).
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_TLS_PORT: "8883"
      MQTT_KEYSTORE_PATH: /etc/safetypad/mqtt/keystore.p12
      MQTT_KEYSTORE_PASSWORD: ${MQTT_KEYSTORE_PASSWORD:-}
      ROUTE_ENABLED: "false"             # stays off until the firmware GPS-ping contract is approved
      SIMULATED_DATA_ENABLED: "false"    # production never seeds demo data
      # Trust X-Forwarded-For only from the Caddy container (docker network range), so per-IP limits see device IPs.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: "172\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    # MQTT over TLS. Bound to loopback until the operator deliberately exposes it (MQTT_PUBLISH_BIND=0.0.0.0) AND the
    # firewall/security group allows 8883. Nothing listens here while MQTT_ENABLED=false.
    ports:
      - "${MQTT_PUBLISH_BIND:-127.0.0.1}:8883:8883"
    volumes:
      - ${MQTT_KEYSTORE_DIR:-./mqtt-keystore}:/etc/safetypad/mqtt:ro   # holds keystore.p12 (never committed)
    healthcheck:
      # /dev/tcp is a bash feature (the default /bin/sh is dash), and the JRE image has no curl/wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]

networks:
  internal:
    internal: false
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
