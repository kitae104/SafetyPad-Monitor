# Base configuration is PRODUCTION-SAFE: no demo data, secure cookies, no dev endpoints.
# Local development must opt in explicitly with SPRING_PROFILES_ACTIVE=dev (see .env.example).
spring:
  application.name: safetypad-monitor
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:safetypad}
    username: ${DB_USER:safetypad}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  jackson:
    time-zone: UTC
    property-naming-strategy: SNAKE_CASE
server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat.max-swallow-size: 64KB
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SPSESSION
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  # Metrics are served on the app port but guarded by a dedicated Basic-auth chain (see SecurityConfig);
  # the public proxy never forwards /actuator/prometheus.
safetypad:
  simulated-data-enabled: ${SIMULATED_DATA_ENABLED:false}
  location-ping-ingest-enabled: ${LOCATION_PING_INGEST_ENABLED:false}
  low-battery-threshold: 20
  ingest:
    device-key-pepper: ${DEVICE_KEY_PEPPER:}
    per-key-per-minute: ${INGEST_PER_KEY_PER_MINUTE:120}
    per-ip-per-minute: ${INGEST_PER_IP_PER_MINUTE:600}
  mqtt:                                  # MQTT ingestion (embedded broker). OFF unless MQTT_ENABLED=true; see docs/MQTT_INTEGRATION.md
    enabled: ${MQTT_ENABLED:false}
    host: ${MQTT_HOST:0.0.0.0}
    tls-port: ${MQTT_TLS_PORT:8883}      # MQTT over TLS - the only listener allowed outside development
    keystore-path: ${MQTT_KEYSTORE_PATH:}
    keystore-password: ${MQTT_KEYSTORE_PASSWORD:}
    keystore-type: ${MQTT_KEYSTORE_TYPE:PKCS12}
    allow-plaintext: false
  metrics:
    username: ${METRICS_USERNAME:}
    password: ${METRICS_PASSWORD:}
  admin:
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  demo:
    data-dir: ${SAFETYPAD_DEMO_DATA_DIR:../data}
  route-enabled: ${ROUTE_ENABLED:false}   # GPS-ping route view; keep OFF in production until the firmware ping contract is approved
  map:
    provider: ${MAP_PROVIDER:mock}   # mock | kakao (kakao without a key falls back to mock)
    api-key: ${MAP_API_KEY:}         # Kakao JavaScript key (browser-public, domain-restricted). Never a REST/admin key.
logging:
  pattern.level: "%5p [%X{requestId:-}]"
